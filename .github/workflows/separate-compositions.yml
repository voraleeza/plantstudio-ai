name: PlantStudio upload startup fix

on:
  push:
    paths:
      - '.github/workflows/separate-compositions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix upload startup syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="+'%'}})if(g!==generation)return;"
          new="+'%'}});if(g!==generation)return;"
          if old not in s:
              raise SystemExit('upload syntax target missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit upload startup fix
        run: |
          git config user.name "PlantStudio Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix photo upload startup syntax" || exit 0
          git push origin main
