name: PlantStudio Save All binding fix

on:
  push:
    paths:
      - '.github/workflows/separate-compositions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix Save All binding
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          bad="$('#saveAllBtn').onclick=saveAllBatchbuildStage();"
          good="$('#saveAllBtn').onclick=saveAllBatch;buildStage();"
          if bad not in s:
              raise SystemExit('bad Save All binding not found')
          s=s.replace(bad,good,1)
          p.write_text(s)
          PY
      - name: Commit binding fix
        run: |
          git config user.name "PlantStudio Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Save All button binding" || exit 0
          git push origin main
