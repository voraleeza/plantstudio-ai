name: PlantStudio high quality cutout fix

on:
  push:
    paths:
      - '.github/workflows/separate-compositions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore high quality cutout and preserve aspect ratio
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()

          # Mark the build so it is obvious which version is live.
          s=s.replace('BATCH SAVE EDITOR','HQ CUTOUT EDITOR',1)

          # Do not stretch a root photo to a 1x1 layer. Start large, then fit to
          # its real image aspect ratio as soon as its cutout is available.
          old="function makeLayer(a,compId){var root=a.isRoot!==false;var l={id:uid(),type:'image',assetId:a.id,compId:compId||a.compId,name:a.name,x:.5,y:.5,w:root?1:.68,h:root?1:.68,scale:1,rot:0,opacity:1,shadow:0,z:layers.filter(x=>x.compId===(compId||a.compId)).length,adjust:defaults(),locked:false};layers.push(l);selected=l.id;return l}"
          new="function makeLayer(a,compId){var root=a.isRoot!==false;var l={id:uid(),type:'image',assetId:a.id,compId:compId||a.compId,name:a.name,x:.5,y:.5,w:root?.96:.68,h:root?.96:.68,scale:1,rot:0,opacity:1,shadow:0,z:layers.filter(x=>x.compId===(compId||a.compId)).length,adjust:defaults(),locked:false};layers.push(l);selected=l.id;return l}"
          if old in s:
              s=s.replace(old,new,1)

          marker="async function makeMask(a){"
          helper="async function fitRootToAspect(a){if(!a||!a.isRoot||!a.cutoutURL)return;try{var im=await imgFrom(a.cutoutURL),ar=im.naturalWidth/im.naturalHeight,car=canvasW/canvasH,l=layers.find(x=>x.assetId===a.id&&x.compId===a.compId);if(!l)return;if(ar>=car){l.w=.96;l.h=.96*car/ar}else{l.h=.96;l.w=.96*ar/car}}catch(e){console.warn('aspect fit failed',e)}}"
          if helper not in s:
              if marker not in s: raise SystemExit('makeMask marker missing')
              s=s.replace(marker,helper+marker,1)

          # Upgrade automatic segmentation to the medium model for cleaner leaf
          # edges. If an iPhone cannot allocate it, retry that photo with small.
          pat=re.compile(r"var out=await fn\(a\.file,\{model:'small',(.*?)\}\);if\(g!==generation\)return;",re.S)
          m=pat.search(s)
          if not m:
              raise SystemExit('cutout call target missing')
          rest=m.group(1)
          repl=("var out;try{out=await fn(a.file,{model:'medium',"+rest+"})}"
                "catch(hqErr){console.warn('Medium cutout unavailable; falling back to small',hqErr);"
                "out=await fn(a.file,{model:'small',"+rest+"})}"
                "if(g!==generation)return;")
          s=s[:m.start()]+repl+s[m.end():]

          # Once the PNG cutout exists, fit it using its real aspect ratio before
          # drawing/exporting it. This keeps the larger presentation sharp and
          # avoids the stretched appearance introduced by the sizing patch.
          old2="a.cutoutURL=URL.createObjectURL(blob);a.state='Cutout ready';a.mask=null;a.originalImg=null;buildStage()"
          new2="a.cutoutURL=URL.createObjectURL(blob);a.state='Cutout ready';a.mask=null;a.originalImg=null;await fitRootToAspect(a);buildStage()"
          if old2 not in s:
              raise SystemExit('cutout completion target missing')
          s=s.replace(old2,new2,1)

          p.write_text(s)
          PY
      - name: Commit quality fix
        run: |
          git config user.name "PlantStudio Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Restore high quality cutout and preserve root aspect ratio" || exit 0
          git push origin main
