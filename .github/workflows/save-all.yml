name: Add Save All for batch compositions

on:
  push:
    paths:
      - '.github/workflows/save-all.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Save All
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('SEPARATE BATCH EDITOR','BATCH SAVE EDITOR',1)

          old='<button id="saveBtn" class="save">⇩ Save / Share</button>'
          new='<button id="saveBtn" class="save">⇩ Save / Share</button><button id="saveAllBtn" class="save" style="background:#2f9d58">⇩ Save All Batch Photos</button>'
          if old in s:
              s=s.replace(old,new,1)
          elif 'id="saveAllBtn"' not in s:
              raise SystemExit('save button target missing')

          start=s.find("$('#saveBtn').onclick=async()=>{")
          end=s.find(';buildStage();',start)
          if start<0 or end<0: raise SystemExit('live save handler target missing')

          helper=r'''async function exportCompBlob(compId){var c=document.createElement('canvas');c.width=canvasW;c.height=canvasH;var x=c.getContext('2d');if(bg!=='clear'){x.fillStyle=bg==='black'?'#000':bg==='white'?'#fff':'#777';x.fillRect(0,0,c.width,c.height)}for(var l of layers.filter(l=>l.compId===compId).slice().sort((a,b)=>a.z-b.z)){x.save();x.globalAlpha=l.opacity==null?1:l.opacity;x.translate(l.x*c.width,l.y*c.height);x.rotate((l.rot||0)*Math.PI/180);x.scale(l.scale||1,l.scale||1);if(l.shadow){x.shadowColor='rgba(0,0,0,.65)';x.shadowBlur=l.shadow;x.shadowOffsetY=l.shadow/4}if(l.type==='image'){var a=asset(l.assetId);if(a){var im=await imgFrom(a.cutoutURL||a.originalURL),w=l.w*c.width,h=l.h*c.height;x.filter=filterFor(l);x.drawImage(im,-w/2,-h/2,w,h);x.filter='none'}}else{x.fillStyle=l.color||'#fff';x.textAlign='center';x.textBaseline='middle';x.font='800 '+Math.round((l.fontSize||72)*c.width/1080)+'px -apple-system,Arial';x.fillText(l.text||'',0,0,l.w*c.width)}x.restore()}return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Export failed')),'image/png',1))}async function saveAllBatch(){var roots=assets.filter(a=>a.isRoot&&a.cutoutURL),btn=$('#saveAllBtn');if(!roots.length){status.textContent='No finished batch photos to save yet.';return}btn.disabled=true;loader.classList.add('on');loaderText.textContent='Preparing batch…';try{var files=[];for(var i=0;i<roots.length;i++){var a=roots[i];loaderText.textContent='Preparing '+(i+1)+' of '+roots.length+'…';var blob=await exportCompBlob(a.compId),base=(a.name||('PlantStudio-'+(i+1))).replace(/\.[^.]+$/,'').replace(/[^a-z0-9_-]+/gi,'-');files.push(new File([blob],base+'-edited.png',{type:'image/png'}));await new Promise(r=>setTimeout(r,80))}loader.classList.remove('on');if(navigator.share&&navigator.canShare?.({files:files}))await navigator.share({files:files,title:'PlantStudio AI batch'});else{for(var f of files){var u=URL.createObjectURL(f),dl=document.createElement('a');dl.href=u;dl.download=f.name;document.body.appendChild(dl);dl.click();dl.remove();setTimeout(()=>revoke(u),2500);await new Promise(r=>setTimeout(r,250))}}status.textContent=files.length+' batch photo(s) exported.'}catch(e){console.error(e);status.textContent=e?.name==='AbortError'?'Save All cancelled.':'Could not save all photos.'}finally{loader.classList.remove('on');btn.disabled=false}}'''
          if 'async function exportCompBlob(' not in s:
              s=s[:start]+helper+s[start:]
              start=s.find("$('#saveBtn').onclick=async()=>{",start+len(helper))
              end=s.find(';buildStage();',start)
          handler_end=end+1
          if "$('#saveAllBtn').onclick=saveAllBatch" not in s:
              s=s[:handler_end]+";$('#saveAllBtn').onclick=saveAllBatch"+s[handler_end:]
          p.write_text(s)
          PY
      - name: Commit Save All
        run: |
          git config user.name "PlantStudio Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Add Save All for separate batch photos" || exit 0
          git push origin main
