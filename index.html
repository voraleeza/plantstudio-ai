<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111214">
<title>PlantStudio AI</title>
<style>
:root{--bg:#111214;--text:#f8f8fa;--muted:#9b9da4;--green:#66e981}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding-bottom:max(20px,env(safe-area-inset-bottom))}
header{padding:max(18px,env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid #25262a;display:flex;justify-content:space-between;align-items:end}.brand b{font-size:23px}.brand span{color:var(--green)}.brand small{display:block;color:#777;font-size:8px;letter-spacing:.15em;margin-top:4px}.pill{font-size:9px;border:1px solid #30563b;background:#14251a;color:#91f5a8;border-radius:99px;padding:8px 11px}.app{max-width:760px;margin:auto;padding:14px}.bar{display:flex;gap:9px}.add,.clear{min-height:54px;border-radius:14px;border:0;font:inherit;font-weight:800}.add{flex:1;background:linear-gradient(135deg,#8df5a5,#58de75);color:#061008}.clear{padding:0 18px;background:#1d1e21;border:1px solid #34363a;color:#ddd}.status{font-size:11px;color:var(--muted);padding:10px 2px}.queue{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.thumb{width:70px;height:70px;flex:0 0 70px;border-radius:12px;overflow:hidden;border:1px solid #333;background:#050505}.thumb img{width:100%;height:100%;object-fit:cover}.canvas{position:relative;aspect-ratio:4/5;background:#000;border:1px solid #3a3c42;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center}.canvas img{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;display:none}.empty{text-align:center;color:#73767d;padding:34px;line-height:1.5}.empty b{display:block;color:#bbb;margin-bottom:5px}.note{margin-top:12px;padding:12px;border:1px solid #292b30;background:#17181b;border-radius:13px;color:#8e9097;font-size:10px;line-height:1.45}
</style>
</head>
<body>
<header><div class="brand"><b>PlantStudio <span>AI</span></b><small>PLANT PHOTO EDITOR</small></div><div class="pill">UPLOAD TEST</div></header>
<main class="app">
<div class="bar"><button id="addBtn" class="add" type="button">📸 Add Photos</button><button id="clearBtn" class="clear" type="button">Clear</button></div>
<input id="fileInput" type="file" accept="image/*" multiple style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
<div id="status" class="status">Tap Add Photos. The selected image should appear immediately.</div>
<div id="queue" class="queue"></div>
<div class="canvas"><img id="preview" alt="Selected photo"><div id="empty" class="empty"><b>No photo selected</b>This build is testing only the iPhone photo picker and preview.</div></div>
<div class="note">No AI or background-removal code runs in this build. This isolates the upload problem completely.</div>
</main>
<script>
(function(){
'use strict';
var addBtn=document.getElementById('addBtn'),clearBtn=document.getElementById('clearBtn'),input=document.getElementById('fileInput'),preview=document.getElementById('preview'),empty=document.getElementById('empty'),status=document.getElementById('status'),queue=document.getElementById('queue'),urls=[];
function openPicker(){status.textContent='Opening photo library…';try{input.click()}catch(e){status.textContent='Could not open photo picker: '+e.message}}
addBtn.addEventListener('click',openPicker,false);
input.addEventListener('change',function(){var files=Array.prototype.slice.call(input.files||[]);if(!files.length){status.textContent='No photo selected.';return}queue.innerHTML='';urls.forEach(function(u){try{URL.revokeObjectURL(u)}catch(e){}});urls=[];files.forEach(function(file,index){if(!file.type||file.type.indexOf('image/')!==0)return;var u=URL.createObjectURL(file);urls.push(u);var box=document.createElement('button');box.type='button';box.className='thumb';var im=document.createElement('img');im.src=u;box.appendChild(im);box.addEventListener('click',function(){preview.src=u;preview.style.display='block';empty.style.display='none'});queue.appendChild(box);if(index===0){preview.src=u;preview.style.display='block';empty.style.display='none'}});status.textContent=files.length+' photo'+(files.length===1?'':'s')+' added successfully.';input.value=''},false);
clearBtn.addEventListener('click',function(){preview.removeAttribute('src');preview.style.display='none';empty.style.display='block';queue.innerHTML='';urls.forEach(function(u){try{URL.revokeObjectURL(u)}catch(e){}});urls=[];status.textContent='Cleared. Tap Add Photos.'});
})();
</script>
</body>
</html>
