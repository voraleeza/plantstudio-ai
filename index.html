<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111214"><title>PlantStudio AI</title><style>*{box-sizing:border-box}body{margin:0;background:#111214;color:#f8f8fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:30px}header{padding:20px 16px 14px;border-bottom:1px solid #292a2e;display:flex;justify-content:space-between;align-items:end}.brand b{font-size:23px}.brand span{color:#66e981}.brand small{display:block;color:#777;font-size:8px;letter-spacing:.14em;margin-top:4px}.pill{font-size:9px;border:1px solid #30563b;background:#14251a;color:#91f5a8;border-radius:99px;padding:8px 10px}.app{max-width:760px;margin:auto;padding:14px}.bar{display:flex;gap:9px}.pick,.clear{min-height:54px;border-radius:14px;font:inherit;font-weight:800}.pick{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:1;background:#66e981;color:#061008}.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:100px}.clear{border:1px solid #34363a;background:#1d1e21;color:#ddd;padding:0 18px}.status{font-size:11px;color:#aaa;padding:10px 2px;min-height:36px}.canvas{position:relative;aspect-ratio:4/5;background:repeating-conic-gradient(#222 0 25%,#171717 0 50%) 50%/20px 20px;border:1px solid #3a3c42;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center}.canvas img{width:100%;height:100%;object-fit:contain;display:none}.empty{text-align:center;color:#73767d;padding:30px}.loader{position:absolute;inset:0;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:5}.loader.on{display:flex}.spin{width:36px;height:36px;border:3px solid #333;border-top-color:#66e981;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.note{margin-top:12px;padding:12px;border:1px solid #292b30;background:#17181b;border-radius:13px;color:#999;font-size:10px;line-height:1.5}</style></head><body><header><div class="brand"><b>PlantStudio <span>AI</span></b><small>SERVER BACKGROUND REMOVAL</small></div><div class="pill">SERVER CUTOUT TEST</div></header><main class="app"><div class="bar"><label class="pick">📸 Add Photo<input id="file" type="file" accept="image/*"></label><button id="clear" class="clear">Clear</button></div><div id="status" class="status">Choose one difficult plant + hand photo.</div><div class="canvas"><img id="preview"><div id="empty" class="empty"><b>No photo selected</b><br>The AI now runs on the server, not on your iPhone.</div><div id="loader" class="loader"><div class="spin"></div><div id="lt">Preparing…</div></div></div><div class="note">The phone only prepares a safe upload. The background-removal model runs on the server and returns a transparent PNG.</div></main><script>(function(){const file=document.getElementById('file'),preview=document.getElementById('preview'),empty=document.getElementById('empty'),loader=document.getElementById('loader'),lt=document.getElementById('lt'),status=document.getElementById('status');let displayURL=null;function revoke(){if(displayURL)try{URL.revokeObjectURL(displayURL)}catch(e){}displayURL=null}function loadImage(u){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=u})}async function prepare(f){const src=URL.createObjectURL(f);try{const img=await loadImage(src);const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);return c.toDataURL('image/jpeg',.88)}finally{URL.revokeObjectURL(src)}}async function run(f){revoke();displayURL=URL.createObjectURL(f);preview.src=displayURL;preview.style.display='block';empty.style.display='none';loader.classList.add('on');lt.textContent='Preparing upload…';status.textContent='Photo loaded. Sending to server remover…';try{const data=await prepare(f);lt.textContent='Server AI removing background… first run can take longer';const r=await fetch('/api/remove-background',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:data,mimeType:'image/jpeg'})});if(!r.ok){let msg='Server returned '+r.status;try{const j=await r.json();if(j.error)msg=j.error}catch(e){}throw new Error(msg)}const blob=await r.blob();if(!blob.type.includes('png'))throw new Error('Server did not return PNG');revoke();displayURL=URL.createObjectURL(blob);preview.src=displayURL;status.textContent='Transparent cutout ready. Check hand, fingers, pot, stems and leaf edges.'}catch(e){console.error(e);status.textContent='Removal failed: '+(e&&e.message?e.message:e)}finally{loader.classList.remove('on')}}file.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)run(f);file.value=''});document.getElementById('clear').onclick=()=>{revoke();preview.removeAttribute('src');preview.style.display='none';empty.style.display='block';loader.classList.remove('on');status.textContent='Cleared.'}})();</script></body></html>
